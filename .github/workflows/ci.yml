name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Lancer les tests
        run: uv run pytest -q
