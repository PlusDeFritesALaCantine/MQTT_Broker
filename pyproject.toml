[project]
name = "brocker-mqtt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.2.13",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.15",
    "sqlalchemy>=2.0.49",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "venv", "env", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501"]
fixable = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F841"]
