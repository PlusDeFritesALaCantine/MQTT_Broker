services:
  emqx:
    image: emqx:latest
    container_name: emqx-broker
    ports:
      - "1883:1883"  
      - "8083:8083"  
      - "8084:8084" 
      - "18083:18083"
    environment:
      - EMQX_NODE__NAME=emqx@127.0.0.1
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=Kawa-Emqx-2026
    networks:
      - iot-network
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
  
  postgres:
    image: postgres:latest
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iot_data
      - POSTGRES_LISTEN_ADDRESSES=0.0.0.0
    ports:
      - "5433:5432"
    networks:
      - iot-network
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
      image: dpage/pgadmin4:latest
      container_name: pgadmin
      environment:
        - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
        - PGADMIN_DEFAULT_PASSWORD=admin
        - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      ports:
        - "8080:80"
      networks:
        - iot-network
      depends_on:
        - postgres

  # Faux serveur SMTP local : capture les emails d'alerte (cahier des charges III.4)
  # sans jamais en envoyer un vrai. UI web sur http://localhost:8025, SMTP sur 1025.
  mailpit:
      image: axllent/mailpit:latest
      container_name: mailpit
      ports:
        - "8025:8025"
        - "1025:1025"
      networks:
        - iot-network

volumes:
  postgres_data:
  emqx_data:
  emqx_log:

networks:
  iot-network:
    driver: bridge